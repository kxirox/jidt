<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courbe de chauffe</title>
<meta name="description" content="Calcule et visualise une courbe de chauffe : recale-la sur un point mesuré ou trouve la courbe idéale.">
<meta name="theme-color" content="#0e1320">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1><span class="logo" aria-hidden="true"></span>Courbe de chauffe</h1>
  <button id="install" class="ghost" hidden>Installer</button>
</header>

<main class="layout">
  <section class="chart-card" aria-label="Graphique de la courbe de chauffe">
    <canvas id="chart" role="img" aria-label="Température de départ en fonction de la température extérieure" title="Touche ou glisse pour lire une valeur"></canvas>
    <div class="legend">
      <span><i class="dot flow"></i>Départ</span>
      <span><i class="dot ret"></i>Retour</span>
      <span id="legRef" hidden><i class="dot ref"></i>Référence</span>
    </div>
  </section>

  <section class="panel">
    <div class="result" id="result" aria-live="polite">
      <div class="r-label" id="rLabel">Départ à 20 °C ext.</div>
      <div class="r-value"><span id="rValue">–</span><small>°C</small></div>
      <label class="rng"><span>Ext. <b id="teOut">20</b> °C</span>
        <input type="range" id="Te" min="-20" max="25" step="0.5" aria-label="Température extérieure">
      </label>
      <label class="rng" id="slopeRow"><span><span id="slopeLbl">Pente</span> <b id="slopeOut">1,40</b> <button type="button" class="link" id="slopeReset" hidden>↺ origine</button></span>
        <input type="range" id="slopeR" min="0.2" max="3.5" step="0.05" aria-label="Pente de la courbe">
      </label>
    </div>

    <form id="form" autocomplete="off" onsubmit="return false">
      <div id="calibBox" class="box">
        <div class="row2">
          <label>Ext. connue (°C)<input type="number" id="pTe" step="0.5" inputmode="decimal"></label>
          <label>Départ connu (°C)<input type="number" id="pTf" step="0.5" inputmode="decimal"></label>
        </div>
        <button type="button" class="link" id="toIdeal">Sans point connu : courbe idéale →</button>
      </div>

      <div id="idealBox" class="box" hidden>
        <label>Régime de dimensionnement
          <select id="regime">
            <option value="90,70">90 / 70 °C</option>
            <option value="80,60">80 / 60 °C</option>
            <option value="70,55" selected>70 / 55 °C – radiateurs classiques</option>
            <option value="55,45">55 / 45 °C – radiateurs basse temp.</option>
            <option value="45,35">45 / 35 °C – plancher chauffant</option>
            <option value="35,28">35 / 28 °C – plancher basse temp.</option>
          </select>
        </label>
        <button type="button" class="link" id="toCalib">← Partir d'un point connu</button>
      </div>

      <details name="more" class="acc">
        <summary>Réglages</summary>
        <div class="acc-body">
          <div class="row2">
            <label>Ambiance voulue (°C)<input type="number" id="Ti" step="0.5" inputmode="decimal"></label>
            <label id="pTiBox">Ambiance du point connu (°C)<input type="number" id="pTi" step="0.5" inputmode="decimal"></label>
          </div>
          <label>Type de courbe
            <select id="curve">
              <option value="lin">Droite : pente</option>
              <option value="exp">Courbe : loi des émetteurs</option>
            </select>
          </label>
          <div class="row2" id="emitRow">
            <label>Émetteurs
              <select id="emitter">
                <option value="1.1">Plancher (n = 1,1)</option>
                <option value="1.3" selected>Radiateurs (n = 1,3)</option>
                <option value="1.4">Convecteurs (n = 1,4)</option>
                <option value="custom">Autre…</option>
              </select>
            </label>
            <label>Exposant n<input type="number" id="n" step="0.05" min="1" max="1.8" inputmode="decimal"></label>
          </div>
          <label>Ext. de base (°C)<input type="number" id="Te0" step="1" inputmode="decimal"></label>
        </div>
      </details>

      <details name="more" class="acc">
        <summary>Détails</summary>
        <div class="acc-body">
          <div class="r-sub" id="rSub"></div>
          <div class="info" id="info"></div>
          <label>Ext. pour un départ de (°C)<input type="number" id="revTf" step="0.5" inputmode="decimal" placeholder="ex. 35"></label>
          <div class="r-sub" id="revOut"></div>
          <p class="foot">Modèle : loi d'émission des corps de chauffe. Valeurs indicatives, à affiner sur site.</p>
        </div>
      </details>

      <details name="more" class="acc">
        <summary>Tableau</summary>
        <div class="acc-body">
          <table class="tbl" aria-label="Valeurs de la courbe">
            <thead><tr><th>Ext.</th><th>Départ</th><th>Retour</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </details>
    </form>
  </section>
</main>

<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
